name: cheezemap

services:
  mysql:
    image: mysql:8.4
    container_name: cheezemap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cheezemap_db}
      MYSQL_USER: ${MYSQL_USER:-cheezemap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cheezemap}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ./Chizu
    container_name: cheezemap
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cheezemap_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cheezemap}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cheezemap}
      FILE_UPLOAD_DIR: /app/uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_GOOGLE_REDIRECT_URI: ${OAUTH2_GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      OAUTH2_NAVER_CLIENT_ID: ${OAUTH2_NAVER_CLIENT_ID:-}
      OAUTH2_NAVER_CLIENT_SECRET: ${OAUTH2_NAVER_CLIENT_SECRET:-}
      OAUTH2_NAVER_REDIRECT_URI: ${OAUTH2_NAVER_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/naver}
      OAUTH2_LINE_CLIENT_ID: ${OAUTH2_LINE_CLIENT_ID:-}
      OAUTH2_LINE_CLIENT_SECRET: ${OAUTH2_LINE_CLIENT_SECRET:-}
      OAUTH2_LINE_REDIRECT_URI: ${OAUTH2_LINE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/line}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
