name: cheezemap

services:
  app:
    build:
      context: ./Chizu
    container_name: cheezemap
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      NAVITIME_API_KEY: ${NAVITIME_API_KEY:-}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_GOOGLE_REDIRECT_URI: ${OAUTH2_GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      OAUTH2_NAVER_CLIENT_ID: ${OAUTH2_NAVER_CLIENT_ID:-}
      OAUTH2_NAVER_CLIENT_SECRET: ${OAUTH2_NAVER_CLIENT_SECRET:-}
      OAUTH2_NAVER_REDIRECT_URI: ${OAUTH2_NAVER_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/naver}
      OAUTH2_LINE_CLIENT_ID: ${OAUTH2_LINE_CLIENT_ID:-}
      OAUTH2_LINE_CLIENT_SECRET: ${OAUTH2_LINE_CLIENT_SECRET:-}
      OAUTH2_LINE_REDIRECT_URI: ${OAUTH2_LINE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/line}
