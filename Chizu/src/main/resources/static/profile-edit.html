<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 수정 | CHEESE MAP</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="css/profile-edit.css">
</head>
<body>
    <main class="profile-edit-page">
        <section class="profile-edit-card">
            <div class="profile-edit-toolbar">
                <div class="language-switcher" role="group" aria-label="Language">
                    <button type="button" class="language-option" data-language="ko">한국어</button>
                    <button type="button" class="language-option" data-language="ja">日本語</button>
                    <button type="button" class="language-option" data-language="en">EN</button>
                </div>

                <a href="index.html" class="back-button" id="profileBackButton" aria-label="돌아가기" data-i18n-aria="backAria">
                    <i class="ti ti-arrow-left"></i>
                </a>
            </div>
            <a href="/" class="back-button" aria-label="돌아가기">
                <i class="ti ti-arrow-left"></i>
            </a>

            <div class="page-heading">
                <div class="profile-edit-avatar" id="profileEditAvatar">
                    <i class="ti ti-user"></i>
                </div>

                <div>
                    <h1 data-i18n="title">프로필 수정</h1>
                    <p data-i18n="description">마이페이지에 표시되는 회원 정보를 수정합니다.</p>
                    <div class="social-account-badge" id="socialAccountBadge" hidden></div>
                </div>
            </div>

            <form id="profileEditForm">
                <label>
                    <span data-i18n="name">이름</span>
                    <input type="text" id="editName" name="userName" autocomplete="name" required>
                </label>

                <label>
                    <span data-i18n="nickname">닉네임</span>
                    <input type="text" id="editNickname" name="userNickname" required>
                </label>

                <label>
                    <span data-i18n="phone">전화번호</span>
                    <input type="tel" id="editPhone" name="userPhone" autocomplete="tel" required>
                </label>

                <label>
                    <span data-i18n="birth">생년월일</span>
                    <input type="date" id="editBirth" name="birth" required>
                </label>

                <fieldset class="profile-gender-field">
                    <legend><span data-i18n="gender">성별</span> <b>*</b></legend>

                    <div class="profile-gender-options">
                        <label>
                            <input type="radio" name="sex" value="true">
                            <span>
                                <i class="ti ti-gender-male"></i>
                                <span data-i18n="male">남성</span>
                            </span>
                        </label>

                        <label>
                            <input type="radio" name="sex" value="false">
                            <span>
                                <i class="ti ti-gender-female"></i>
                                <span data-i18n="female">여성</span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <label class="profile-photo-field">
                    <span data-i18n="photo">프로필 사진</span>

                    <div class="profile-photo-input">
                        <input type="file" id="editPhoto" accept="image/*">
                    </div>
                </label>

                <div id="localPasswordSection" class="local-password-section">
                    <div class="form-divider">
                        <span data-i18n="passwordChange">비밀번호 변경</span>
                    </div>

                    <div class="password-grid">
                        <label>
                            <span data-i18n="currentPassword">현재 비밀번호</span>
                            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password">
                        </label>

                        <label>
                            <span data-i18n="newPassword">새 비밀번호</span>
                            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="6">
                        </label>

                        <label class="password-confirm-field">
                            <span data-i18n="newPasswordConfirm">새 비밀번호 확인</span>
                            <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" autocomplete="new-password" minlength="6">
                        </label>
                    </div>
                </div>

                <div class="social-password-guide" id="socialPasswordGuide" hidden>
                    <i class="ti ti-shield-lock"></i>
                    <div>
                        <strong id="socialPasswordTitle">소셜 계정으로 로그인 중</strong>
                        <span id="socialPasswordDescription" data-i18n="socialPasswordDescription">
                            비밀번호는 가입한 소셜 서비스에서 변경할 수 있습니다.
                        </span>
                    </div>
                </div>

                <p class="form-message" id="profileEditMessage" aria-live="polite"></p>

                <div class="form-actions">
                    <a href="/" class="cancel-button">취소</a>
                    <button type="submit" class="save-button">수정 완료</button>
                    <a href="index.html" class="cancel-button" data-i18n="cancel">취소</a>
                    <button type="submit" class="save-button" data-i18n="save">수정 완료</button>
                </div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/profile-edit.js"></script>
</body>
</html>
