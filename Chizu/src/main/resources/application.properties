spring.application.name=cheezemap

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Google Places / Maps (브라우저 index.html도 /api/public/config 통해 동일 키 사용)
google.api.key=${GOOGLE_API_KEY}

# NAVITIME Route(totalnavi) via RapidAPI
navitime.api.key=${NAVITIME_API_KEY:}
navitime.api.host=navitime-route-totalnavi.p.rapidapi.com
navitime.api.url=https://navitime-route-totalnavi.p.rapidapi.com/route_transit

app.oauth2.success-redirect-uri=/
app.oauth2.failure-redirect-uri=/

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email
spring.security.oauth2.client.registration.google.scope[3]=https://www.googleapis.com/auth/user.birthday.read
spring.security.oauth2.client.registration.google.scope[4]=https://www.googleapis.com/auth/user.gender.read
spring.security.oauth2.client.registration.google.scope[5]=https://www.googleapis.com/auth/user.phonenumbers.read

# OAuth2 - Naver
spring.security.oauth2.client.registration.naver.client-id=${OAUTH2_NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${OAUTH2_NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=${OAUTH2_NAVER_REDIRECT_URI:http://localhost:8080/login/oauth2/code/naver}
spring.security.oauth2.client.registration.naver.scope[0]=name
spring.security.oauth2.client.registration.naver.scope[1]=email
spring.security.oauth2.client.registration.naver.scope[2]=birthday
spring.security.oauth2.client.registration.naver.scope[3]=mobile
spring.security.oauth2.client.registration.naver.scope[4]=gender
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth2 - LINE
spring.security.oauth2.client.registration.line.client-id=${OAUTH2_LINE_CLIENT_ID}
spring.security.oauth2.client.registration.line.client-secret=${OAUTH2_LINE_CLIENT_SECRET}
spring.security.oauth2.client.registration.line.client-name=LINE
spring.security.oauth2.client.registration.line.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.line.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.line.redirect-uri=${OAUTH2_LINE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/line}
spring.security.oauth2.client.registration.line.scope[0]=profile
spring.security.oauth2.client.registration.line.scope[1]=openid
spring.security.oauth2.client.registration.line.scope[2]=email
spring.security.oauth2.client.provider.line.authorization-uri=https://access.line.me/oauth2/v2.1/authorize
spring.security.oauth2.client.provider.line.token-uri=https://api.line.me/oauth2/v2.1/token
spring.security.oauth2.client.provider.line.jwk-set-uri=https://api.line.me/oauth2/v2.1/certs
spring.security.oauth2.client.provider.line.user-info-uri=https://api.line.me/oauth2/v2.1/userinfo
spring.security.oauth2.client.provider.line.user-name-attribute=sub